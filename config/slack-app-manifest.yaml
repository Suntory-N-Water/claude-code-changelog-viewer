_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: CCログ超訳
  description: Claude Code の更新情報を通知する Slack App
  long_description: >-
    Claude Code のバージョンの変更履歴を AI が分析し、日本語で分かりやすく解説した内容を
    Slack チャンネルに通知するアプリです。新しいバージョンがリリースされると、変更点の要約・機能追加・バグ修正・
    破壊的変更などの情報を自動的にチャンネルへ配信します。各変更についてユーザーへの影響をわかりやすくお届けします。
    claude-code-log.com と連携して動作する非公式プロジェクトです。
  background_color: "#DB8163"

features:
  bot_user:
    display_name: CCログ超訳
    always_online: false

oauth_config:
  scopes:
    bot:
      - incoming-webhook

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
