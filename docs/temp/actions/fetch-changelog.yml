name: Fetch Claude Code CHANGELOG

on:
  schedule:
    # 毎時実行(UTC基準)
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: fetch-changelog
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch CHANGELOG
        id: fetch
        continue-on-error: true
        run: |
          pnpm run fetch:changelog
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report no changes
        if: steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code == '1'
        run: |
          echo "ℹ️  No changelog updates detected."
          echo "All versions are up to date."

      - name: Report error
        if: steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code != '1' && steps.fetch.outputs.exit_code != '0'
        run: |
          echo "❌ Error occurred while fetching changelog."
          exit 1

      - name: Check for changes
        id: git-check
        run: |
          git add -A

          # チェンジログ（*.md）ファイルの変更のみをカウント
          CHANGELOG_CHANGES=$(git diff --staged --name-only -- 'apps/changelog-fetcher/changelogs/*.md' | wc -l)
          echo "changelog_changes=$CHANGELOG_CHANGES" >> "$GITHUB_OUTPUT"

          # チェンジログに変更がある場合のみ should_push=true
          if [ "$CHANGELOG_CHANGES" -gt 0 ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "✅ チェンジログに更新あり: $CHANGELOG_CHANGES ファイル"
            git diff --staged --name-only -- 'apps/changelog-fetcher/changelogs/*.md'
          else
            echo "ℹ️ チェンジログに更新なし（メタデータのみの変更はスキップ）"
          fi

          # 全変更ファイル数（コミットメッセージ用）
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.git-check.outputs.should_push == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S JST')

          if [ "$CHANGED_COUNT" -eq 1 ]; then
            COMMIT_MSG="📝 Update CHANGELOG - 1 file changed"
          else
            COMMIT_MSG="📝 Update CHANGELOG - $CHANGED_COUNT files changed"
          fi

          git commit -m "$COMMIT_MSG" -m "Automated CHANGELOG update at $TIMESTAMP"
        env:
          CHANGED_COUNT: ${{ steps.git-check.outputs.changed_files }}

      - name: Push changes
        if: steps.git-check.outputs.should_push == 'true'
        run: |
          git pull --rebase origin main
          git push

      - name: Report status
        if: always()
        run: |
          if [ -f "apps/changelog-fetcher/metadata/last_fetch.json" ]; then
            echo "📊 Fetch Summary:"
            jq . apps/changelog-fetcher/metadata/last_fetch.json
          fi
