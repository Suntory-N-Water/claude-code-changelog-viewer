packages:
  - 'packages/*'
  - 'apps/*'
# postinstall 等のライフサイクルスクリプトを許可リスト制にする(pnpm v10 のデフォルト動作だが意図を明示)
strictDepBuilds: true

# true: ビルドスクリプトの実行を許可 / false: 実行不要と明示してエラー表示を抑制
allowBuilds:
  '@biomejs/biome': true
  '@resvg/resvg-js': true
  better-sqlite3: true
  esbuild: true
  core-js-pure: false
  protobufjs: false
  sharp: false
  workerd: false

# 公開後 1 日未満のパッケージをインストール拒否(ゼロデイ型サプライチェーン攻撃対策)
minimumReleaseAge: 1440

# ワークスペース横断で共通するパッケージバージョンを一元管理する
# 各 package.json では "zod": "catalog:" と記述することで参照できる
catalog:
  '@google/genai': ^1.48.0
  '@types/node': ^24.12.2
  p-retry: ^8.0.0
  typescript: ~5.9.3
  wrangler: ^4.83.0
  zod: ^4.3.6
