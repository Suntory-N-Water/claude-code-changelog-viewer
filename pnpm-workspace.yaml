packages:
  - "packages/*"
  - "apps/*"

# ワークスペース横断で共通するパッケージバージョンを一元管理する
# 各 package.json では "zod": "catalog:" と記述することで参照できる
catalog:
  "@google/genai": ^1.52.0
  "@types/node": ^24.13.3
  p-retry: ^8.0.0
  "@typescript/native": "npm:typescript@^7.0.2"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  wrangler: ^4.123.0
  zod: ^4.4.3

# 公開後 1 日未満のパッケージをインストール拒否(ゼロデイ型サプライチェーン攻撃対策)
minimumReleaseAge: 1440

# pnpm v11: ビルドスクリプトの実行を許可するパッケージ
allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0
  - pnpm@11.8.0
