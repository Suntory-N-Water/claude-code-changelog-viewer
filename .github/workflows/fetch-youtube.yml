name: Fetch YouTube Sources

on:
  workflow_dispatch:

concurrency:
  group: fetch-youtube
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      has_new_videos: ${{ steps.video-check.outputs.has_new_videos }}
      should_push: ${{ steps.video-check.outputs.should_push }}
      changed_files: ${{ steps.video-check.outputs.changed_files }}
      new_video_count: ${{ steps.video-check.outputs.new_video_count }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 環境セットアップ
        uses: ./.github/actions/setup

      - name: YouTube metadata を取得
        run: pnpm run fetch:youtube-metadata -- --out "${RUNNER_TEMP}/youtube-new-ids.json"
        env:
          NODE_ENV: production
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: 新規動画と変更を確認
        id: video-check
        run: |
          NEW_VIDEO_COUNT=$(node -e "const fs = require('node:fs'); const ids = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/youtube-new-ids.json', 'utf-8')); console.log(ids.length);")
          if [ "$NEW_VIDEO_COUNT" -gt 0 ]; then
            HAS_NEW_VIDEOS=true
          else
            HAS_NEW_VIDEOS=false
          fi

          git add apps/docs-tracker/sources/youtube/
          CHANGED_FILES=$(git diff --staged --name-only -- 'apps/docs-tracker/sources/youtube/' | grep -c '\.md$' || true)

          if [ "$CHANGED_FILES" -gt 0 ]; then
            echo "✅ YouTube ソースに更新あり: $CHANGED_FILES ファイル"
            git diff --staged --name-only -- 'apps/docs-tracker/sources/youtube/'
            SHOULD_PUSH=true
          else
            echo "ℹ️ YouTube ソースに更新なし"
            SHOULD_PUSH=false
          fi

          {
            echo "new_video_count=$NEW_VIDEO_COUNT"
            echo "has_new_videos=$HAS_NEW_VIDEOS"
            echo "changed_files=$CHANGED_FILES"
            echo "should_push=$SHOULD_PUSH"
          } >> "$GITHUB_OUTPUT"

      - name: 新規動画 ID を artifact 化
        if: steps.video-check.outputs.has_new_videos == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-new-ids
          path: ${{ runner.temp }}/youtube-new-ids.json

      - name: metadata 取得結果を artifact 化
        if: steps.video-check.outputs.should_push == 'true'
        run: tar -czf "$RUNNER_TEMP/youtube-sources-metadata.tgz" apps/docs-tracker/sources/youtube/

      - name: metadata archive を upload
        if: steps.video-check.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-sources-metadata
          path: ${{ runner.temp }}/youtube-sources-metadata.tgz

  transcripts:
    needs: metadata
    if: needs.metadata.outputs.has_new_videos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 環境セットアップ
        uses: ./.github/actions/setup

      - name: metadata 取得結果を展開
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: youtube-sources-metadata
          path: ${{ github.workspace }}/artifacts

      - name: metadata archive を復元
        run: tar -xzf "${GITHUB_WORKSPACE}/artifacts/youtube-sources-metadata.tgz" -C .

      - name: 新規動画 ID を展開
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: youtube-new-ids
          path: ${{ github.workspace }}/artifacts

      - name: YouTube transcript を取得
        run: pnpm run fetch:youtube-transcripts -- --video-ids-file "${GITHUB_WORKSPACE}/artifacts/youtube-new-ids.json"
        env:
          NODE_ENV: production

      - name: transcript 取得結果を artifact 化
        if: always()
        run: tar -czf "$RUNNER_TEMP/youtube-sources-transcripts.tgz" apps/docs-tracker/sources/youtube/

      - name: transcript archive を upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtube-sources-transcripts
          path: ${{ runner.temp }}/youtube-sources-transcripts.tgz

  pr:
    needs: [metadata, transcripts]
    if: always() && needs.metadata.result == 'success' && needs.metadata.outputs.should_push == 'true' && (needs.transcripts.result == 'success' || needs.transcripts.result == 'failure' || needs.transcripts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 環境セットアップ
        uses: ./.github/actions/setup

      - name: metadata 取得結果を展開
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: youtube-sources-metadata
          path: ${{ github.workspace }}/artifacts

      - name: metadata archive を復元
        run: tar -xzf "${GITHUB_WORKSPACE}/artifacts/youtube-sources-metadata.tgz" -C .

      - name: transcript 取得結果を展開
        if: needs.transcripts.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: youtube-sources-transcripts
          path: ${{ github.workspace }}/artifacts

      - name: transcript archive を復元
        if: needs.transcripts.result != 'skipped'
        continue-on-error: true
        run: tar -xzf "${GITHUB_WORKSPACE}/artifacts/youtube-sources-transcripts.tgz" -C .

      - name: PR メタデータ準備
        id: pr-meta
        env:
          CHANGED_COUNT: ${{ needs.metadata.outputs.changed_files }}
          NEW_VIDEO_COUNT: ${{ needs.metadata.outputs.new_video_count }}
          TRANSCRIPTS_RESULT: ${{ needs.transcripts.result }}
        run: |
          git add apps/docs-tracker/sources/youtube/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLE="chore: YouTube ソースを更新 (${NEW_VIDEO_COUNT} videos)"
          BODY="YouTube ソースの自動更新"$'\n\n'"自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"$'\n'"新規動画数: ${NEW_VIDEO_COUNT}"$'\n'"変更ファイル数: ${CHANGED_COUNT}"$'\n'"transcripts job: ${TRANSCRIPTS_RESULT}"$'\n\n'"変更ファイル:"

          for file in $(git diff --staged --name-only -- 'apps/docs-tracker/sources/youtube/' | head -20); do
            BODY="${BODY}"$'\n'"- ${file}"
          done

          {
            echo "title=${TITLE}"
            echo "body<<EOF"
            echo "${BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: プルリクエストを作成
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/update-youtube-sources
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          add-paths: apps/docs-tracker/sources/youtube/
          delete-branch: true

      - name: PR をマージ
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --admin \
            --delete-branch
          echo "✓ PR #${PR_NUMBER} をマージしました"

  notify-failure:
    needs: [metadata, transcripts, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 失敗時に Issue を作成
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: YouTube ソース取得に失敗
          ISSUE_SUMMARY: YouTube metadata または transcript の自動取得に失敗しました。
          ISSUE_LABELS: automated-failure,workflow:fetch-youtube,bug,documentation
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
