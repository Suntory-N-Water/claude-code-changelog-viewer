name: Fetch Claude Code CHANGELOG

on:
  schedule:
    # 毎時実行（UTC基準）
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: fetch-changelog
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Fetch CHANGELOG
        run: pnpm --filter changelog-fetcher fetch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Analyze CHANGELOG
        id: analyze
        run: |
          pnpm --filter changelog-fetcher analyze
          # 最新のanalysis_*.jsonからバージョン番号を抽出
          if ls apps/changelog-fetcher/metadata/analysis_*.json 1> /dev/null 2>&1; then
            VERSION=$(ls -1 apps/changelog-fetcher/metadata/analysis_*.json | tail -1 | sed 's/.*analysis_v\(.*\)\.json/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "has_analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_analysis=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Infer benefits using Copilot SDK
        if: steps.analyze.outputs.has_analysis == 'true'
        run: |
          VERSION="${{ steps.analyze.outputs.version }}"
          pnpm --filter changelog-fetcher infer "$VERSION"
        env:
          COPILOT_MODEL: claude-sonnet-4.5

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          git diff --staged --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S JST')

          # バージョン番号が利用可能な場合はコミットメッセージに含める
          if [ "$HAS_ANALYSIS" = "true" ] && [ -n "$VERSION" ]; then
            COMMIT_MSG="feat: add AI benefits for v$VERSION"
          elif [ "$CHANGED_COUNT" -eq 1 ]; then
            COMMIT_MSG="📝 Update CHANGELOG - 1 file changed"
          else
            COMMIT_MSG="📝 Update CHANGELOG - $CHANGED_COUNT files changed"
          fi

          git commit -m "$COMMIT_MSG" -m "Automated CHANGELOG update at $TIMESTAMP"
        env:
          CHANGED_COUNT: ${{ steps.git-check.outputs.changed_files }}
          HAS_ANALYSIS: ${{ steps.analyze.outputs.has_analysis }}
          VERSION: ${{ steps.analyze.outputs.version }}

      - name: Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push

      - name: Report status
        if: always()
        run: |
          if [ -f "apps/changelog-fetcher/metadata/last_fetch.json" ]; then
            echo "📊 Fetch Summary:"
            jq . apps/changelog-fetcher/metadata/last_fetch.json
          fi
