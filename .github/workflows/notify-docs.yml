name: Notify Documentation Changes

permissions: {}

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to analyze"
        required: true
        type: string
      changed_files_count:
        description: "Number of changed files"
        required: true
        type: number
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Send Discord notification
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CHANGED_FILES_COUNT: ${{ inputs.changed_files_count }}
        run: |
          cd apps/changelog-fetcher

          echo "📤 Sending Discord notification for commit ${COMMIT_SHA}..."
          pnpm run notify:docs-send "${COMMIT_SHA}" --changed-files "${CHANGED_FILES_COUNT}"

          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Discord notification sent successfully"
          else
            echo "⚠️ Discord notification failed (exit code: $EXIT_CODE)"
            echo "This is not a critical error, workflow will continue"
          fi

      - name: Report status
        if: always()
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CHANGED_FILES_COUNT: ${{ inputs.changed_files_count }}
        run: |
          echo "📊 Notification workflow completed"
          echo "   Commit SHA: ${COMMIT_SHA}"
          echo "   Changed files: ${CHANGED_FILES_COUNT}"
