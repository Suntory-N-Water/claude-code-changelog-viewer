name: Fetch Blog Sources

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: fetch-blog
  cancel-in-progress: false

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      should_push: ${{ steps.git-check.outputs.should_push }}
      changed_files: ${{ steps.git-check.outputs.changed_files }}
      claude_changes: ${{ steps.git-check.outputs.claude_changes }}
      news_changes: ${{ steps.git-check.outputs.news_changes }}
      engineering_changes: ${{ steps.git-check.outputs.engineering_changes }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 環境セットアップ
        uses: ./.github/actions/setup

      - name: blog を取得
        run: pnpm run fetch:blog
        env:
          NODE_ENV: production

      - name: 変更確認
        id: git-check
        run: |
          git add apps/docs-tracker/sources/

          CLAUDE_CHANGES=$(git diff --staged --name-only -- 'apps/docs-tracker/sources/claude-blog/' | grep -c '\.md$' || true)
          NEWS_CHANGES=$(git diff --staged --name-only -- 'apps/docs-tracker/sources/anthropic-news/' | grep -c '\.md$' || true)
          ENGINEERING_CHANGES=$(git diff --staged --name-only -- 'apps/docs-tracker/sources/anthropic-engineering/' | grep -c '\.md$' || true)
          CHANGED_FILES=$((CLAUDE_CHANGES + NEWS_CHANGES + ENGINEERING_CHANGES))

          if [ "$CHANGED_FILES" -gt 0 ]; then
            echo "✅ blog ソースに更新あり: $CHANGED_FILES ファイル"
            git diff --staged --name-only -- 'apps/docs-tracker/sources/'
            SHOULD_PUSH=true
          else
            echo "ℹ️ blog ソースに更新なし"
            SHOULD_PUSH=false
          fi

          {
            echo "claude_changes=$CLAUDE_CHANGES"
            echo "news_changes=$NEWS_CHANGES"
            echo "engineering_changes=$ENGINEERING_CHANGES"
            echo "changed_files=$CHANGED_FILES"
            echo "should_push=$SHOULD_PUSH"
          } >> "$GITHUB_OUTPUT"

      - name: 取得結果を artifact 化
        if: steps.git-check.outputs.should_push == 'true'
        run: tar -czf "$RUNNER_TEMP/blog-sources.tgz" apps/docs-tracker/sources/

      - name: 取得結果 archive を upload
        if: steps.git-check.outputs.should_push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-sources
          path: ${{ runner.temp }}/blog-sources.tgz

  pr:
    needs: fetch
    if: needs.fetch.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 環境セットアップ
        uses: ./.github/actions/setup

      - name: 取得結果を展開
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blog-sources
          path: ${{ github.workspace }}/artifacts

      - name: sources archive を復元
        run: tar -xzf "${GITHUB_WORKSPACE}/artifacts/blog-sources.tgz" -C .

      - name: PR メタデータ準備
        id: pr-meta
        env:
          CHANGED_COUNT: ${{ needs.fetch.outputs.changed_files }}
          CLAUDE_CHANGES: ${{ needs.fetch.outputs.claude_changes }}
          NEWS_CHANGES: ${{ needs.fetch.outputs.news_changes }}
          ENGINEERING_CHANGES: ${{ needs.fetch.outputs.engineering_changes }}
        run: |
          git add apps/docs-tracker/sources/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLE="chore: blog ソースを更新 (claude:${CLAUDE_CHANGES}, news:${NEWS_CHANGES}, engineering:${ENGINEERING_CHANGES})"
          BODY="blog ソースの自動更新"$'\n\n'"自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"$'\n'"変更ファイル数: ${CHANGED_COUNT}"$'\n\n'"変更ファイル:"

          for file in $(git diff --staged --name-only -- 'apps/docs-tracker/sources/' | head -20); do
            BODY="${BODY}"$'\n'"- ${file}"
          done

          {
            echo "title=${TITLE}"
            echo "body<<EOF"
            echo "${BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: プルリクエストを作成
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/update-blog-sources
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          add-paths: apps/docs-tracker/sources/
          delete-branch: true

      - name: PR をマージ
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch
          echo "✓ PR #${PR_NUMBER} をマージしました"

  notify-failure:
    needs: [fetch, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 失敗時に Issue を作成
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: blog ソース取得に失敗
          ISSUE_SUMMARY: Claude / Anthropic blog ソースの自動取得に失敗しました。
          ISSUE_LABELS: automated-failure,workflow:fetch-blog,bug,documentation
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
