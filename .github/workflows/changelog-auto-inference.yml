name: Fetch and Analyze CHANGELOG
run-name: Fetch and Analyze CHANGELOG (${{ inputs.detected_hash }})

on:
  workflow_dispatch:
    inputs:
      detected_hash:
        description: "notification-worker が検知した CHANGELOG.md の SHA256 ハッシュ"
        required: false
        type: string
      detected_at:
        description: "notification-worker が検知した時刻 (ISO 8601)"
        required: false
        type: string

concurrency:
  group: fetch-and-tie
  cancel-in-progress: false

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: read

    outputs:
      has_updates: ${{ steps.detect.outputs.has_updates }}
      has_notifiable: ${{ steps.detect.outputs.has_notifiable }}
      changed_versions: ${{ steps.detect.outputs.changed_versions }}
      notifiable_versions: ${{ steps.detect.outputs.notifiable_versions }}
      new_count: ${{ steps.detect.outputs.new_count }}
      updated_count: ${{ steps.detect.outputs.updated_count }}

    steps:
      - name: Log dispatch context
        env:
          DETECTED_HASH: ${{ inputs.detected_hash }}
          DETECTED_AT: ${{ inputs.detected_at }}
        run: |
          echo "detected_hash=${DETECTED_HASH:-(なし)}"
          echo "detected_at=${DETECTED_AT:-(なし)}"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Fetch and detect updates
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          DETECTED_HASH: ${{ inputs.detected_hash }}
        run: |
          set -euo pipefail

          set +e
          pnpm run fetch:changelog
          FETCH_EXIT=$?
          set -e

          if [ "$FETCH_EXIT" -eq 1 ]; then
            {
              echo "has_updates=false"
              echo "has_notifiable=false"
            } >> "$GITHUB_OUTPUT"
            echo "ℹ️ チェンジログに更新なし"
            exit 0
          fi
          if [ "$FETCH_EXIT" -ne 0 ]; then
            exit "$FETCH_EXIT"
          fi

          SUMMARY="apps/changelog-fetcher/metadata/last_fetch_summary.json"
          if [ ! -f "$SUMMARY" ]; then
            {
              echo "has_updates=false"
              echo "has_notifiable=false"
            } >> "$GITHUB_OUTPUT"
            echo "ℹ️ fetch summary がないため更新なし"
            exit 0
          fi

          CURRENT=$(jq -r '.version' claude-version.json)
          NEW=$(jq -r '.newVersions[]' "$SUMMARY")
          UPDATED=$(jq -r '.updatedVersions[]' "$SUMMARY")
          NEW_COUNT=$(jq -r '.newVersions | length' "$SUMMARY")
          UPDATED_COUNT=$(jq -r '.updatedVersions | length' "$SUMMARY")

          NOTIFIABLE=""
          while IFS= read -r version; do
            [ -n "$version" ] || continue
            clean_version="${version#v}"
            clean_current="${CURRENT#v}"

            if [ "$clean_version" != "$clean_current" ] && \
              [ "$(printf '%s\n%s\n' "$clean_current" "$clean_version" | sort -V | tail -n1)" = "$clean_version" ]; then
              NOTIFIABLE="${NOTIFIABLE} ${version}"
            fi
          done <<EOF
          $NEW
          EOF

          CHANGED=$(printf '%s\n%s\n' "$NEW" "$UPDATED" | sed '/^$/d' | sort -uV | xargs)
          NOTIFIABLE=$(printf '%s\n' "$NOTIFIABLE" | tr ' ' '\n' | sed '/^$/d' | sort -uV | xargs)

          if [ -z "$CHANGED" ]; then
            {
              echo "has_updates=false"
              echo "has_notifiable=false"
            } >> "$GITHUB_OUTPUT"
            echo "ℹ️ チェンジログに更新なし"
            exit 0
          fi

          {
            echo "has_updates=true"
            if [ -n "$NOTIFIABLE" ]; then
              echo "has_notifiable=true"
            else
              echo "has_notifiable=false"
            fi
            echo "changed_versions=$CHANGED"
            echo "notifiable_versions=$NOTIFIABLE"
            echo "new_count=$NEW_COUNT"
            echo "updated_count=$UPDATED_COUNT"
          } >> "$GITHUB_OUTPUT"

          echo "✅ チェンジログに更新あり"
          echo "解析対象: $CHANGED"
          echo "通知対象: ${NOTIFIABLE:-なし}"

      - name: Upload fetch outputs
        if: steps.detect.outputs.has_updates == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fetch-outputs
          path: |
            apps/changelog-fetcher/changelogs/
            apps/changelog-fetcher/metadata/
            apps/changelog-fetcher/diff/
          retention-days: 7
          if-no-files-found: error

  ai:
    needs: fetch
    if: needs.fetch.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-uv

      - name: Download fetch outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fetch-outputs
          path: apps/changelog-fetcher/

      - name: Analyze changelogs
        env:
          CHANGED_VERSIONS: ${{ needs.fetch.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            echo "🔍 Analyzing $version..."
            pnpm run analyze "$version"
          done

      - name: Verify analysis files
        env:
          CHANGED_VERSIONS: ${{ needs.fetch.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            if [ ! -f "apps/changelog-fetcher/analysis/analysis_${version}.json" ]; then
              echo "❌ Missing analysis file for $version"
              exit 1
            fi
            echo "✅ analysis_${version}.json created"
          done

      - name: Tie issues to changelog items
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGED_VERSIONS: ${{ needs.fetch.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            echo "🔗 Tying issues for $version..."
            pnpm run tie:issues "$version"
          done

      - name: Infer benefits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_VERSIONS: ${{ needs.fetch.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            echo "🤖 Inferring benefits for $version..."
            pnpm run infer "$version"
          done

      - name: Upload AI outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-outputs
          path: |
            apps/changelog-fetcher/analysis/
            apps/changelog-fetcher/tied/
            apps/changelog-fetcher/inferred/
          retention-days: 7
          if-no-files-found: error

  pr:
    needs: [fetch, ai]
    if: needs.fetch.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write
      pull-requests: write

    outputs:
      merge_sha: ${{ steps.merge-pr.outputs.merge_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download fetch outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fetch-outputs
          path: apps/changelog-fetcher/

      - name: Download AI outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-outputs
          path: apps/changelog-fetcher/

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        if: needs.fetch.outputs.has_notifiable == 'true'
        env:
          NOTIFIABLE_VERSIONS: ${{ needs.fetch.outputs.notifiable_versions }}
        run: |
          chmod +x .github/scripts/update-version.sh
          # shellcheck disable=SC2086
          .github/scripts/update-version.sh $NOTIFIABLE_VERSIONS

      - name: Format code
        run: pnpm run format

      - name: Prepare PR metadata
        id: pr-meta
        env:
          CHANGED_VERSIONS: ${{ needs.fetch.outputs.changed_versions }}
          NOTIFIABLE_VERSIONS: ${{ needs.fetch.outputs.notifiable_versions }}
          NEW_COUNT: ${{ needs.fetch.outputs.new_count }}
          UPDATED_COUNT: ${{ needs.fetch.outputs.updated_count }}
        run: |
          FIRST_VERSION=$(echo "$CHANGED_VERSIONS" | awk '{print $1}')
          TITLE="chore: CHANGELOG を更新 (新規 ${NEW_COUNT}, 過去更新 ${UPDATED_COUNT})"

          {
            echo "branch=chore/changelog-${FIRST_VERSION}"
            echo "title=${TITLE}"
            echo "body<<EOF"
            echo "解析対象バージョン: ${CHANGED_VERSIONS}"
            echo "通知対象バージョン: ${NOTIFIABLE_VERSIONS:-なし}"
            echo ""
            echo "自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pr-meta.outputs.branch }}
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          delete-branch: true

      - name: Merge pull request
        id: merge-pr
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch
          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "✓ PR #${PR_NUMBER} をマージしました"

  notify:
    needs: [fetch, ai, pr]
    if: needs.fetch.outputs.has_notifiable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Tokyo

    permissions:
      checks: read
      contents: read

    steps:
      - name: Wait for notification worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_SHA" ]; then
            echo "❌ マージコミット SHA を取得できませんでした" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            CHECK=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Workers Builds: notification-worker")] | sort_by(.started_at) | last | if . == null then "queued\t" else "\(.status)\t\(.conclusion // "")" end')
            IFS=$'\t' read -r STATUS CONCLUSION <<< "$CHECK"

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "✓ notification-worker のデプロイが完了しました"
              exit 0
            fi
            if [ "$STATUS" = "completed" ]; then
              echo "❌ notification-worker のデプロイに失敗しました: ${CONCLUSION}" >&2
              exit 1
            fi

            echo "⏳ notification-worker のデプロイを待機中 (${attempt}/60)"
            sleep 5
          done

          echo "❌ notification-worker のデプロイ待機がタイムアウトしました" >&2
          exit 1

      - name: Download AI outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-outputs
          path: apps/changelog-fetcher/

      - name: Trigger notification dispatch
        env:
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          NOTIFIABLE_VERSIONS: ${{ needs.fetch.outputs.notifiable_versions }}
        # inferred JSON は最大 1MB に達し Cloudflare Queues の 1メッセージ上限 (128KB) を超えるため、
        # notification-worker が利用するフィールドだけに jq で絞り込んでから POST する。
        run: |
          set -euo pipefail
          echo "📤 通知配信をトリガー..."
          for version in $NOTIFIABLE_VERSIONS; do
            inferred_path="apps/changelog-fetcher/inferred/inferred_${version}.json"
            if [ ! -f "$inferred_path" ]; then
              echo "❌ ${inferred_path} が見つかりません" >&2
              exit 1
            fi
            jq --arg version "$version" \
              '{version: $version, analysis: {version: .version, summary: .summary, items: [.items[] | {content, content_ja, prefix}]}}' \
              "$inferred_path" \
              | curl -f -X POST "${NOTIFICATION_WORKER_URL}/api/dispatch" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${DISPATCH_SECRET}" \
                  --data-binary @-
            echo "✓ ${version} の通知配信をキューに投入しました"
          done

  report-failure:
    needs: [fetch, ai, pr, notify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create issue on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: CHANGELOG処理に失敗
          ISSUE_SUMMARY: |
            CHANGELOGの取得・解析・推論処理に失敗しました。

            **対象バージョン**: ${{ needs.fetch.outputs.changed_versions }}
          ISSUE_LABELS: automated-failure,workflow:changelog-auto-inference,bug
          FAILED_JOBS: |
            fetch=${{ needs.fetch.result }}
            ai=${{ needs.ai.result }}
            pr=${{ needs.pr.result }}
            notify=${{ needs.notify.result }}
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
