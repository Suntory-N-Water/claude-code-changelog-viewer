name: Fetch and Analyze CHANGELOG

on:
  workflow_dispatch:
    inputs:
      detected_hash:
        description: "notification-worker が検知した CHANGELOG.md の SHA256 ハッシュ"
        required: false
        type: string
      detected_at:
        description: "notification-worker が検知した時刻 (ISO 8601)"
        required: false
        type: string

concurrency:
  group: changelog-auto-inference
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-and-infer-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Log dispatch context
        env:
          DETECTED_HASH: ${{ inputs.detected_hash }}
          DETECTED_AT: ${{ inputs.detected_at }}
        run: |
          echo "detected_hash=${DETECTED_HASH:-(なし)}"
          echo "detected_at=${DETECTED_AT:-(なし)}"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Fetch CHANGELOG
        id: fetch
        continue-on-error: true
        run: |
          pnpm run fetch:changelog
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Handle no updates
        if: steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code == '1'
        run: |
          echo "ℹ️  No changelog updates detected."
          echo "All versions are up to date."
          exit 0

      - name: Handle fetch error
        if:
          steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code != '1' &&
          steps.fetch.outputs.exit_code != '0'
        run: |
          echo "❌ Error occurred while fetching changelog."
          exit 1

      - name: Detect updated versions
        id: detect-updates
        run: |
          git add -A

          SUMMARY="apps/changelog-fetcher/metadata/last_fetch_summary.json"
          if [ ! -f "$SUMMARY" ]; then
            {
              echo "has_updates=false"
              echo "has_notifiable=false"
            } >> "$GITHUB_OUTPUT"
            echo "ℹ️ fetch summary がないため更新なし"
            exit 0
          fi

          CURRENT=$(jq -r '.version' claude-version.json)
          NEW=$(jq -r '.newVersions[]' "$SUMMARY")
          UPDATED=$(jq -r '.updatedVersions[]' "$SUMMARY")
          NEW_COUNT=$(jq -r '.newVersions | length' "$SUMMARY")
          UPDATED_COUNT=$(jq -r '.updatedVersions | length' "$SUMMARY")

          NOTIFIABLE=""
          while IFS= read -r version; do
            [ -n "$version" ] || continue
            clean_version="${version#v}"
            clean_current="${CURRENT#v}"

            if [ "$clean_version" != "$clean_current" ] && \
              [ "$(printf '%s\n%s\n' "$clean_current" "$clean_version" | sort -V | tail -n1)" = "$clean_version" ]; then
              NOTIFIABLE="${NOTIFIABLE} ${version}"
            fi
          done <<EOF
          $NEW
          EOF

          CHANGED=$(printf '%s\n%s\n' "$NEW" "$UPDATED" | sed '/^$/d' | sort -uV)
          SALVAGED=""
          for file in apps/changelog-fetcher/changelogs/*.md; do
            [ -e "$file" ] || continue
            version=$(basename "$file" .md)
            if [ ! -f "apps/changelog-fetcher/analysis/analysis_${version}.json" ] || \
              [ ! -f "apps/changelog-fetcher/inferred/inferred_${version}.json" ]; then
              SALVAGED="${SALVAGED} ${version}"
            fi
          done

          CHANGED=$(printf '%s\n%s\n' "$CHANGED" "$SALVAGED" | sed '/^$/d' | sort -uV | xargs)
          NOTIFIABLE=$(printf '%s\n' "$NOTIFIABLE" | tr ' ' '\n' | sed '/^$/d' | sort -uV | xargs)

          if [ -z "$CHANGED" ]; then
            {
              echo "has_updates=false"
              echo "has_notifiable=false"
            } >> "$GITHUB_OUTPUT"
            echo "ℹ️ チェンジログに更新なし"
            exit 0
          fi

          {
            echo "has_updates=true"
            if [ -n "$NOTIFIABLE" ]; then
              echo "has_notifiable=true"
            else
              echo "has_notifiable=false"
            fi
            echo "changed_versions=$CHANGED"
            echo "notifiable_versions=$NOTIFIABLE"
            echo "new_count=$NEW_COUNT"
            echo "updated_count=$UPDATED_COUNT"
          } >> "$GITHUB_OUTPUT"

          echo "✅ チェンジログに更新あり"
          echo "解析対象: $CHANGED"
          echo "通知対象: ${NOTIFIABLE:-なし}"

      - name: Analyze changelogs
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          CHANGED_VERSIONS: ${{ steps.detect-updates.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            echo "🔍 Analyzing $version..."
            pnpm run analyze "$version"
          done

      - name: Verify analysis files
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          CHANGED_VERSIONS: ${{ steps.detect-updates.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            if [ ! -f "apps/changelog-fetcher/analysis/analysis_${version}.json" ]; then
              echo "❌ Missing analysis file for $version"
              exit 1
            fi
            echo "✅ analysis_${version}.json created"
          done

      - name: Infer benefits
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_VERSIONS: ${{ steps.detect-updates.outputs.changed_versions }}
        run: |
          for version in $CHANGED_VERSIONS; do
            echo "🤖 Inferring benefits for $version..."
            pnpm run infer "$version"
          done

      - name: Stage inferred files
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          CHANGED_VERSIONS: ${{ steps.detect-updates.outputs.changed_versions }}
        # create-pull-request action は push 後に working tree を reset --hard するため、
        # 通知配信ステップが参照できるよう RUNNER_TEMP に inferred JSON を退避する。
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/inferred"
          for version in $CHANGED_VERSIONS; do
            src="apps/changelog-fetcher/inferred/inferred_${version}.json"
            if [ ! -f "$src" ]; then
              echo "❌ Missing inferred file for $version" >&2
              exit 1
            fi
            cp "$src" "${RUNNER_TEMP}/inferred/"
            echo "✅ inferred_${version}.json をステージしました"
          done

      - name: Configure Git
        if: steps.detect-updates.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        if: steps.detect-updates.outputs.has_notifiable == 'true'
        env:
          NOTIFIABLE_VERSIONS: ${{ steps.detect-updates.outputs.notifiable_versions }}
        run: |
          chmod +x .github/scripts/update-version.sh
          # shellcheck disable=SC2086
          .github/scripts/update-version.sh $NOTIFIABLE_VERSIONS

      - name: Format code
        if: steps.detect-updates.outputs.has_updates == 'true'
        run: pnpm run format

      - name: Prepare PR metadata
        id: pr-meta
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          CHANGED_VERSIONS: ${{ steps.detect-updates.outputs.changed_versions }}
          NOTIFIABLE_VERSIONS: ${{ steps.detect-updates.outputs.notifiable_versions }}
          NEW_COUNT: ${{ steps.detect-updates.outputs.new_count }}
          UPDATED_COUNT: ${{ steps.detect-updates.outputs.updated_count }}
        run: |
          FIRST_VERSION=$(echo "$CHANGED_VERSIONS" | awk '{print $1}')
          TITLE="chore: CHANGELOG を更新 (新規 ${NEW_COUNT}, 過去更新 ${UPDATED_COUNT})"

          {
            echo "branch=chore/changelog-${FIRST_VERSION}"
            echo "title=${TITLE}"
            echo "body<<EOF"
            echo "解析対象バージョン: ${CHANGED_VERSIONS}"
            echo "通知対象バージョン: ${NOTIFIABLE_VERSIONS:-なし}"
            echo ""
            echo "自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        if: steps.detect-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pr-meta.outputs.branch }}
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          delete-branch: true

      - name: Merge pull request
        if: steps.detect-updates.outputs.has_updates == 'true' &&
          steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch
          echo "✓ PR #${PR_NUMBER} をマージしました"

      - name: Trigger notification dispatch
        if: steps.detect-updates.outputs.has_notifiable == 'true'
        env:
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          NOTIFIABLE_VERSIONS: ${{ steps.detect-updates.outputs.notifiable_versions }}
        # inferred JSON は最大 1MB に達し Cloudflare Queues の 1メッセージ上限 (128KB) を超えるため、
        # notification-worker が利用するフィールドだけに jq で絞り込んでから POST する。
        run: |
          set -euo pipefail
          echo "📤 通知配信をトリガー..."
          for version in $NOTIFIABLE_VERSIONS; do
            inferred_path="${RUNNER_TEMP}/inferred/inferred_${version}.json"
            if [ ! -f "$inferred_path" ]; then
              echo "❌ ${inferred_path} が見つかりません" >&2
              exit 1
            fi
            jq --arg version "$version" \
              '{version: $version, analysis: {version: .version, summary: .summary, items: [.items[] | {content, content_ja, prefix}]}}' \
              "$inferred_path" \
              | curl -f -X POST "${NOTIFICATION_WORKER_URL}/api/dispatch" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${DISPATCH_SECRET}" \
                  --data-binary @-
            echo "✓ ${version} の通知配信をキューに投入しました"
          done

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: CHANGELOG処理に失敗
          ISSUE_SUMMARY: |
            CHANGELOGの取得・解析・推論処理に失敗しました。

            **対象バージョン**: ${{ steps.detect-updates.outputs.changed_versions }}
          ISSUE_LABELS: automated-failure,workflow:changelog-auto-inference,bug
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
