name: Fetch and Analyze CHANGELOG

on:
  schedule:
    # 毎時実行(UTC基準)
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: changelog-auto-inference
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-and-infer-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Fetch CHANGELOG
        id: fetch
        continue-on-error: true
        run: |
          pnpm run fetch:changelog
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Handle no updates
        if: steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code == '1'
        run: |
          echo "ℹ️  No changelog updates detected."
          echo "All versions are up to date."
          exit 0

      - name: Handle fetch error
        if:
          steps.fetch.outcome == 'failure' && steps.fetch.outputs.exit_code != '1' &&
          steps.fetch.outputs.exit_code != '0'
        run: |
          echo "❌ Error occurred while fetching changelog."
          exit 1

      - name: Detect updated versions
        id: detect-updates
        run: |
          git add -A

          # チェンジログ(*.md)ファイルの変更を検出
          CHANGED_FILES=$(git diff --staged --name-only -- 'apps/changelog-fetcher/changelogs/*.md')

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ チェンジログに更新なし"
            exit 0
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"

            # ファイル名からバージョン抽出 (apps/changelog-fetcher/changelogs/vX.Y.Z.md → vX.Y.Z)
            NEW_VERSIONS=$(echo "$CHANGED_FILES" | sed 's|apps/changelog-fetcher/changelogs/||' | sed 's|\.md$||' | tr '\n' ' ' | xargs)
            echo "new_versions=$NEW_VERSIONS" >> "$GITHUB_OUTPUT"

            echo "✅ チェンジログに更新あり"
            echo "$CHANGED_FILES"
            echo ""
            echo "対象バージョン: $NEW_VERSIONS"
          fi

      - name: Analyze changelogs
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          for version in $NEW_VERSIONS; do
            echo "🔍 Analyzing $version..."
            pnpm run analyze "$version"
          done

      - name: Verify analysis files
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          for version in $NEW_VERSIONS; do
            if [ ! -f "apps/changelog-fetcher/analysis/analysis_${version}.json" ]; then
              echo "❌ Missing analysis file for $version"
              exit 1
            fi
            echo "✅ analysis_${version}.json created"
          done

      - name: Infer benefits
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          for version in $NEW_VERSIONS; do
            echo "🤖 Inferring benefits for $version..."
            pnpm run infer "$version"
          done

      - name: Verify inferred files
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          for version in $NEW_VERSIONS; do
            if [ ! -f "apps/changelog-fetcher/inferred/inferred_${version}.json" ]; then
              echo "❌ Missing inferred file for $version"
              exit 1
            fi
            echo "✅ inferred_${version}.json created"
          done

      - name: Configure Git
        if: steps.detect-updates.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          chmod +x .github/scripts/update-version.sh
          # shellcheck disable=SC2086
          .github/scripts/update-version.sh $NEW_VERSIONS

      - name: Format code
        if: steps.detect-updates.outputs.has_updates == 'true'
        run: pnpm run format

      - name: Prepare PR metadata
        id: pr-meta
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          VERSION_COUNT=$(echo "$NEW_VERSIONS" | wc -w | tr -d ' ')
          FIRST_VERSION=$(echo "$NEW_VERSIONS" | awk '{print $1}')

          {
            echo "branch=chore/changelog-${FIRST_VERSION}"
            echo "title=chore: CHANGELOGを更新 (${VERSION_COUNT} versions)"
            echo "body<<EOF"
            echo "対象バージョン: ${NEW_VERSIONS}"
            echo ""
            echo "自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        if: steps.detect-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pr-meta.outputs.branch }}
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          delete-branch: true

      - name: Merge pull request
        if: steps.detect-updates.outputs.has_updates == 'true' &&
          steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch
          echo "✓ PR #${PR_NUMBER} をマージしました"

      - name: Trigger notification dispatch
        if: steps.detect-updates.outputs.has_updates == 'true'
        env:
          NOTIFICATION_WORKER_URL: ${{ secrets.NOTIFICATION_WORKER_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          NEW_VERSIONS: ${{ steps.detect-updates.outputs.new_versions }}
        run: |
          echo "📤 通知配信をトリガー..."
          VERSIONS_JSON=$(echo "$NEW_VERSIONS" | tr ' ' '\n' | jq -R . | jq -s .)
          curl -f -X POST "${NOTIFICATION_WORKER_URL}/api/dispatch" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DISPATCH_SECRET}" \
            -d "{\"versions\": ${VERSIONS_JSON}}"
          echo "✓ 通知配信をキューに投入しました"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: CHANGELOG処理に失敗
          ISSUE_SUMMARY: |
            CHANGELOGの取得・解析・推論処理に失敗しました。

            **対象バージョン**: ${{ steps.detect-updates.outputs.new_versions }}
          ISSUE_LABELS: automated-failure,workflow:changelog-auto-inference,bug
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
