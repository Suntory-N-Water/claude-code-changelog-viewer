name: Generate Settings Reference

on:
  schedule:
    # 毎日 JST 6:00 (UTC 21:00) に実行
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: generate-settings-reference
  cancel-in-progress: false

permissions: {}

jobs:
  generate-settings-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-uv

      - name: Generate settings reference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm run generate:settings

      - name: プルリクエストを作成してマージ
        uses: ./.github/actions/automated-pr
        with:
          token: ${{ github.token }}
          branch: chore/update-settings-reference
          commit-message: "chore: 設定リファレンスを更新"
          title: "chore: 設定リファレンスを更新"
          body: |
            設定リファレンスの自動更新

      - name: Create issue on failure
        if: failure()
        uses: ./.github/actions/report-automated-failure
        with:
          token: ${{ github.token }}
          title: 設定リファレンス生成に失敗
          summary: 設定リファレンスの自動生成に失敗しました。
          labels: automated-failure,workflow:generate-settings-reference,bug
