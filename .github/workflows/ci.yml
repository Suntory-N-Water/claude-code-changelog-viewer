name: CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "chore/changelog-**"
      - "chore/update-docs"
      - "chore/update-settings-reference"
    paths:
      - ".github/**"
      - "apps/**/src/**"
      - "packages/**/src/**"
      - "package.json"
      - "apps/**/package.json"
      - "packages/**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tsconfig.base.json"
      - "apps/**/tsconfig.json"
      - "packages/**/tsconfig.json"
      - "vitest.config.ts"
      - "apps/**/vitest.config.ts"
      - "packages/**/vitest.config.ts"
      - "**/*.config.ts"
      - "apps/**/*.jsonc"
      - "biome.jsonc"
      - "knip.json"

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run check

  knip:
    name: knip
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm knip

  test:
    name: test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run test

  type-check:
    name: type-check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter www exec astro sync
        env:
          SITE_DATA_SKIP_FETCH: "1"
      - run: pnpm run type-check
