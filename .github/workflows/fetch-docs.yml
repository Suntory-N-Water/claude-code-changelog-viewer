name: Fetch Claude Code Documentation

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update all documents"
        required: false
        default: false
        type: boolean

# Prevent concurrent executions to avoid git conflicts
concurrency:
  group: fetch-docs
  cancel-in-progress: false

permissions: {}

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # Need write permission to commit changes
      pull-requests: write
      issues: write # Need write permission to create issues on failure

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Fetch all history for proper git diff
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Fetch documentation
        run: pnpm run fetch:docs
        env:
          NODE_ENV: production

      - name: Fetch settings schema
        run: pnpm run fetch:schema
        env:
          NODE_ENV: production

      - name: Check for changes
        id: git-check
        run: |
          git add -A

          # 英語ドキュメント(docs/en/*.md)ファイルの変更をカウント
          DOC_CHANGES=$(git diff --staged --name-only -- 'apps/docs-tracker/docs/en/' | grep -c '\.md$' || true)
          echo "doc_changes=$DOC_CHANGES" >> "$GITHUB_OUTPUT"

          # スキーマの変更を確認
          SCHEMA_CHANGES=$(git diff --staged --name-only -- 'apps/docs-tracker/schema/' | grep -c '\.json$' || true)
          echo "schema_changes=$SCHEMA_CHANGES" >> "$GITHUB_OUTPUT"

          # 英語ドキュメントまたはスキーマに変更がある場合のみ should_push=true
          if [ "$DOC_CHANGES" -gt 0 ] || [ "$SCHEMA_CHANGES" -gt 0 ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            if [ "$DOC_CHANGES" -gt 0 ]; then
              echo "✅ 英語ドキュメントに更新あり: $DOC_CHANGES ファイル"
              git diff --staged --name-only -- 'apps/docs-tracker/docs/en/' | grep '\.md$'
            fi
            if [ "$SCHEMA_CHANGES" -gt 0 ]; then
              echo "✅ スキーマに更新あり: $SCHEMA_CHANGES ファイル"
              git diff --staged --name-only -- 'apps/docs-tracker/schema/'
            fi
          else
            echo "ℹ️ 英語ドキュメント・スキーマに更新なし(日本語ドキュメントのみの変更はスキップ)"
          fi

          # 全変更ファイル数(コミットメッセージ用)
          CHANGED_FILES=$(git diff --staged --name-only | wc -l)
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"

          # Get list of changed files
          if [ "$CHANGED_FILES" -gt 0 ]; then
            echo "Changed files:"
            git diff --staged --name-only
          fi

      - name: Generate docs diff JSON
        if: steps.git-check.outputs.should_push == 'true'
        run: pnpm run generate:docs-diff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      - name: Stage diff file
        if: steps.git-check.outputs.should_push == 'true'
        run: git add apps/docs-tracker/diffs/

      - name: Prepare PR metadata
        id: pr-meta
        if: steps.git-check.outputs.should_push == 'true'
        env:
          CHANGED_COUNT: ${{ steps.git-check.outputs.changed_files }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLE="chore: Claude Codeドキュメントを更新 (${CHANGED_COUNT} files)"
          BODY="Claude Codeドキュメントの自動更新"$'\n\n'"自動更新時刻: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"$'\n\n'"変更ファイル:"

          for file in $(git diff --staged --name-only | head -20); do
            BODY="${BODY}"$'\n'"- ${file}"
          done

          {
            echo "title=${TITLE}"
            echo "body<<EOF"
            echo "${BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        if: steps.git-check.outputs.should_push == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/update-docs
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          delete-branch: true

      - name: Merge pull request
        if: steps.git-check.outputs.should_push == 'true' &&
          steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch
          echo "✓ PR #${PR_NUMBER} をマージしました"

      - name: Report status
        if: always()
        run: |
          if [ "$HAS_CHANGES" == "true" ]; then
            echo "✅ Documentation updated successfully!"
            echo "📊 Changed files: $CHANGED_FILES"
          else
            echo "ℹ️ No changes detected in documentation"
          fi

          # Show metadata summary if it exists
          if [ -f "apps/docs-tracker/metadata/last_update.json" ]; then
            echo ""
            echo "📈 Fetch Summary:"
            cat apps/docs-tracker/metadata/last_update.json
          fi

          # Show schema metadata summary if it exists
          if [ -f "apps/docs-tracker/metadata/last_schema_update.json" ]; then
            echo ""
            echo "📋 Schema Summary:"
            cat apps/docs-tracker/metadata/last_schema_update.json
          fi
        env:
          HAS_CHANGES: ${{ steps.git-check.outputs.should_push }}
          CHANGED_FILES: ${{ steps.git-check.outputs.changed_files }}

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_TITLE: Claude Codeドキュメント取得に失敗
          ISSUE_SUMMARY: Claude Codeドキュメントと設定スキーマの自動取得に失敗しました。
          ISSUE_LABELS: automated-failure,workflow:fetch-docs,bug,documentation
        with:
          script: |
            const createIssue = require('./.github/scripts/create-automated-failure-issue.cjs');
            await createIssue({ github, context, core });
