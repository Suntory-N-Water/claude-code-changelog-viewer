name: Weekly Report

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: weekly-report-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >
      github.event.label.name == 'weekly-report'
      && github.actor == 'Suntory-N-Water'
      && github.event.issue.user.login == 'Suntory-N-Water'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # claude-code-action が Anthropic API に OIDC トークンを提示するため必須
      id-token: write
      # 処理開始コメントを issue に投稿する
      issues: write

    env:
      TZ: Asia/Tokyo

    outputs:
      week: ${{ steps.parse.outputs.week }}
      period_start: ${{ steps.parse.outputs.period_start }}
      period_end: ${{ steps.parse.outputs.period_end }}
      selected_count: ${{ steps.parse.outputs.selected_count }}
      total_items: ${{ steps.parse.outputs.total_items }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse issue body
        id: parse
        env:
          # Issue body は untrusted。必ず env 経由で受け、run script に直接埋め込まない。
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Claude Code のサンドボックス(checkout ディレクトリ)から読める場所に置く必要があるため、runner.temp ではなく workspace 配下にする。
          INPUT_FILE_PATH: ${{ github.workspace }}/.tmp/weekly-input.json
        run: |
          mkdir -p "$(dirname "$INPUT_FILE_PATH")"
          python3 .github/scripts/weekly-report-parse-issue.py

      - name: Post start comment on source issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEK: ${{ steps.parse.outputs.week }}
          SELECTED_COUNT: ${{ steps.parse.outputs.selected_count }}
          TOTAL_ITEMS: ${{ steps.parse.outputs.total_items }}
        run: |
          BODY="週次記事の生成を開始しました (${WEEK}, ${SELECTED_COUNT} / ${TOTAL_ITEMS} 件)。
          Actions run: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-uv

      - name: Generate weekly report with Claude Code
        id: claude
        uses: anthropics/claude-code-action@1623c36729ac1cd5895198cded705a287de7db79 # v1.0.187
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /weekly-post --input-file ${{ github.workspace }}/.tmp/weekly-input.json
          # claude-code-action はリポジトリの .claude/settings.json を自動ロードしないため、
          # weekly-post skill が必要とする権限を claude_args で明示する。
          # - acceptEdits: 記事の Write/Edit と .tmp/ 作成の mkdir を自動承認
          # - Bash(python3:*): skill の extract.py / skeleton.py / snippets.py 実行に必須
          # - その他 Bash(...): 生成物の検証・デバッグで Claude が使いがちなコマンド
          claude_args: >-
            --model claude-opus-5
            --max-turns 50
            --debug
            --permission-mode acceptEdits
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python3:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(test:*),Bash(diff:*)"
          # PR 未作成などの silent failure 調査用。issue body / 生成物ともに社内メンバーしか投稿できない前提。
          show_full_output: "true"

      - name: Upload generated artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-report-${{ github.event.issue.number }}
          path: apps/changelog-fetcher/posts/weekly/**/*.md
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: weekly-report-${{ github.event.issue.number }}
          path: apps/changelog-fetcher/posts/weekly/

      - name: Prepare PR metadata
        id: pr-meta
        env:
          WEEK: ${{ needs.generate.outputs.week }}
          PERIOD_START: ${{ needs.generate.outputs.period_start }}
          PERIOD_END: ${{ needs.generate.outputs.period_end }}
          SELECTED_COUNT: ${{ needs.generate.outputs.selected_count }}
          TOTAL_ITEMS: ${{ needs.generate.outputs.total_items }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "branch=docs/weekly-${WEEK}-issue-${ISSUE_NUMBER}"
            echo "title=docs: 週次アップデート (${WEEK})"
            echo "body<<PR_BODY_EOF"
            echo "Issue #${ISSUE_NUMBER} で選定された changelog から週次記事を生成しました。"
            echo ""
            echo "- 対象週: ${WEEK}"
            echo "- 期間: ${PERIOD_START} ~ ${PERIOD_END}"
            echo "- 選定件数: ${SELECTED_COUNT} / 全 ${TOTAL_ITEMS} 件"
            echo ""
            echo "生成後の推敲を実施してください(skill の手順は下書きまでです)。"
            echo ""
            echo "Actions run: ${RUN_URL}"
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create-pr
        uses: ./.github/actions/automated-pr
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pr-meta.outputs.branch }}
          commit-message: ${{ steps.pr-meta.outputs.title }}
          title: ${{ steps.pr-meta.outputs.title }}
          body: ${{ steps.pr-meta.outputs.body }}
          merge: "false"

      - name: Post success comment on source issue
        if: success() && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          BODY="週次記事の PR を作成しました: #${PR_NUMBER}
          マージすると本 Issue も自動 close されます。"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"

      # Claude Code は成功終了したが差分が無く PR が作成されなかった場合を silent failure として通知する。
      # ここで exit 1 して notify-failure job を発火させる(失敗コメントの本文はそちらに集約)。
      - name: Fail when no PR was created
        if: success() && steps.create-pr.outputs.pull-request-number == ''
        run: |
          echo "::error::create-pull-request が差分を検出せず PR を作成しませんでした。Claude Code が想定パスにファイルを生成したか確認してください。"
          exit 1

  notify-failure:
    needs: [generate, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Post failure comment on source issue
        env:
          GH_TOKEN: ${{ github.token }}
          # checkout していないため、gh に対象リポジトリを明示する
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="週次記事の生成に失敗しました。
          Actions run: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
