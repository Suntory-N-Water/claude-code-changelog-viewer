rules:
  artipacked:
    ignore:
      # fetch-docs.yml needs persist-credentials to push commits
      - fetch-docs.yml:36
      # changelog-auto-inference.yml needs persist-credentials to push commits
      - changelog-auto-inference.yml:32
      # generate-settings-reference.yml needs persist-credentials to push commits
      - generate-settings-reference.yml:29
  dependabot-cooldown:
    ignore:
      # issue #767で指定された3日間のクールダウンを優先する
      - dependabot.yml
