name: "Setup uv"
description: "Setup uv and sync apps/docs-search-engine's Python dependencies"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        working-directory: apps/docs-search-engine

    - run: uv sync
      shell: bash
      working-directory: apps/docs-search-engine
