name: "Setup uv"
description: "Setup uv and sync apps/docs-search-engine's Python dependencies"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        working-directory: apps/docs-search-engine

    - run: uv sync
      shell: bash
      working-directory: apps/docs-search-engine
