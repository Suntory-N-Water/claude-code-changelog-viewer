name: "Setup uv"
description: "Setup uv and sync apps/docs-search-engine's Python dependencies"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        working-directory: apps/docs-search-engine

    - run: uv sync
      shell: bash
      working-directory: apps/docs-search-engine
