name: 週次アップデート記事の生成
description: 選定済み changelog JSON から週次記事の下書き PR を作成する
title: "週次アップデート記事の生成"
labels:
  - weekly-report
body:
  - type: markdown
    attributes:
      value: |
        管理画面で選定・コメントした changelog JSON を貼り付けてください。
        Submit するとラベル `weekly-report` が自動付与され、`weekly-report.yml` workflow が起動して下書き PR を発行します。
  - type: textarea
    id: selection-json
    attributes:
      label: 選定 JSON
      description: |
        管理画面から export した JSON をそのまま貼り付けてください。
        期待するフォーマット:
        `{ "week": "2026-w28", "period_start": "2026-07-06", "period_end": "2026-07-12", "total_items": 12, "items": [ { "id": "...", "version": "2.1.205", "comment": "..." } ] }`
      render: json
    validations:
      required: true
